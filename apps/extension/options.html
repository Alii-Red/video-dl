<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Video DL — réglages extension</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 420px;
        margin: 2rem auto;
        color: #1a1a1a;
      }
      label {
        display: block;
        margin: 1rem 0 0.25rem;
        font-size: 0.9rem;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 0.5rem;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        margin-top: 1.25rem;
        padding: 0.5rem 1rem;
        background: #10b981;
        color: white;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
      .hint {
        font-size: 0.8rem;
        color: #666;
        margin-top: 1.5rem;
      }
      #status {
        margin-left: 0.75rem;
        color: #10b981;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <h1>Video DL — détection live</h1>
    <p>Copie le port et le token depuis l'onglet <strong>Réglages</strong> de l'app Video DL.</p>

    <label for="port">Port</label>
    <input id="port" type="number" value="8787" />

    <label for="token">Token</label>
    <input id="token" type="text" placeholder="collé depuis l'app" />

    <div>
      <button id="save">Enregistrer</button>
      <span id="status"></span>
    </div>

    <p class="hint">
      L'extension se connecte à <code>ws://127.0.0.1:&lt;port&gt;</code>. L'app Video DL
      doit être lancée. Rien ne quitte ta machine.
    </p>

    <script src="options.js"></script>
  </body>
</html>
